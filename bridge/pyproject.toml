[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scenario-forge-bridge"
version = "0.2.3"
description = "Scenario Forge Bridge: links a machine running CARLA to a Scenario Forge project."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12",
  "httpx>=0.27",
  "websockets>=13",
  "keyring>=25",
  "platformdirs>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pyinstaller>=6"]

[project.scripts]
scenario-forge-bridge = "scenario_forge_bridge.cli:main"
sfbridge = "scenario_forge_bridge.cli:main"

[tool.setuptools.packages.find]
include = ["scenario_forge_bridge*"]

[tool.ruff]
target-version = "py310"
line-length = 160
extend-exclude = ["tests/fake_carla"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
