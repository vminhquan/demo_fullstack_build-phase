services:
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    environment:
      # DATABASE_URL from .env (Render DB); unset it to fall back to the local postgres container.
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://scenario:${DB_PASSWORD}@postgres:5432/scenario_forge}
      AGENT_SERVICE_URL: http://agent2:8100
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build: ./backend
    env_file: .env
    environment:
      # DATABASE_URL from .env (Render DB); unset it to fall back to the local postgres container.
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://scenario:${DB_PASSWORD}@postgres:5432/scenario_forge}
    # Migrations, then the shipped default CARLA data (idempotent).
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed_catalog"]
    depends_on:
      postgres:
        condition: service_healthy
        # Local postgres only starts with --profile local-db.
        required: false
    restart: "no"

  agent2:
    build: ./agent2
    # Agent2 receives selected CARLA snapshots from the Backend; no database access. Its tool calls read
    # the stored snapshots back through the Backend's internal catalog endpoints.
    environment:
      APP_ENV: ${APP_ENV:-development}
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      BACKEND_URL: http://backend:8000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AGENT2_MODEL_NAME: ${AGENT2_MODEL_NAME:-gpt-4o-mini}
      # INFO: every LLM turn, tool call and result; DEBUG adds the system prompt and the XOSC.
      AGENT2_LOG_LEVEL: ${AGENT2_LOG_LEVEL:-INFO}
      AGENT2_LOG_MAX_CHARS: ${AGENT2_LOG_MAX_CHARS:-4000}
    expose:
      - "8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg17
    # Local DB, kept for reuse: docker compose --profile local-db up (and unset DATABASE_URL in .env).
    profiles: ["local-db"]
    environment:
      POSTGRES_DB: scenario_forge
      POSTGRES_USER: scenario
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scenario -d scenario_forge"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
